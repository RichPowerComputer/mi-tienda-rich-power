<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Meta tag optimizado para iPhone/iOS (evita problemas de zoom y escala) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rich Power | Configurador Gamer</title>
  
  <!-- Librerías base actualizadas a CDNJS (Más compatibles con Safari/iOS) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Íconos profesionales -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#05050a] text-slate-200 font-sans selection:bg-purple-500 selection:text-white m-0 p-0">
  
  <div id="root"></div>

  <!-- LÓGICA DE LA APLICACIÓN -->
  <script type="text/babel" data-type="module">
    const { useState, useEffect } = React;

    const STORE_PHONE = "573144890002"; 
    const DEFAULT_CITY = "Bucaramanga / Cañaveral";

    function App() {
      const [step, setStep] = useState(0);
      const [isProcessing, setIsProcessing] = useState(false);
      const [loadingText, setLoadingText] = useState("Analizando requerimientos...");

      const [formData, setFormData] = useState({
        goal: '', 
        games: [],
        budget: 3000000,
        resolution: '',
        hasPC: '',
        tradeIn: '',
        peripherals: [],
        name: '',
        phone: '',
        city: DEFAULT_CITY,
      });

      const handleSelect = (field, value, multi = false) => {
        if (multi) {
          setFormData(prev => ({
            ...prev,
            [field]: prev[field].includes(value) 
              ? prev[field].filter(item => item !== value)
              : [...prev[field], value]
          }));
        } else {
          setFormData(prev => ({ ...prev, [field]: value }));
        }
      };

      const nextStep = () => {
        if (step === 1 && formData.goal === 'components') { setStep(6); return; }
        if (step === 4 && formData.goal === 'new_pc') { setStep(6); return; }
        
        if (step === 7) {
          setStep(8);
          simulateAIProcessing();
          return;
        }
        setStep(s => s + 1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const prevStep = () => {
        if (step === 6 && formData.goal === 'components') setStep(1);
        else if (step === 6 && formData.goal === 'new_pc') setStep(4);
        else setStep(s => s - 1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const simulateAIProcessing = () => {
        setIsProcessing(true);
        setTimeout(() => setLoadingText("Optimizando presupuesto..."), 1500);
        setTimeout(() => setLoadingText("Seleccionando los mejores componentes..."), 3000);
        setTimeout(() => {
          setIsProcessing(false);
          setStep(9);
        }, 4500);
      };

      const formatCurrency = (value) => {
        return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(value);
      };

      const generateWhatsAppLink = () => {
        const { name, phone, city, goal, games, budget, resolution, hasPC, tradeIn, peripherals } = formData;
        
        let text = `🔥 *NUEVA SOLICITUD DE COTIZACIÓN - RICH POWER* 🔥\n\n`;
        text += `👤 *Cliente:* ${name}\n`;
        text += `📍 *Ubicación:* ${city}\n`;
        text += `📱 *Teléfono:* ${phone}\n\n`;
        
        text += `🎯 *OBJETIVO:* \n${goal === 'new_pc' ? 'Comprar PC Gamer Completa' : goal === 'upgrade' ? 'Mejorar PC Actual' : 'Solo Periféricos/Componentes'}\n\n`;
        
        if (goal !== 'components') {
          text += `💰 *PRESUPUESTO ESTIMADO:* \n${formatCurrency(budget)}\n\n`;
          text += `🎮 *JUEGOS/USO PRINCIPAL:* \n${games.length > 0 ? games.join(', ') : 'No especificado'}\n\n`;
          text += `🖥️ *RENDIMIENTO ESPERADO:* \n${resolution}\n\n`;
        }
        
        if (goal === 'upgrade') {
          text += `⚙️ *PC ACTUAL:* \n- Tiene PC: ${hasPC}\n- Retoma: ${tradeIn}\n\n`;
        }
        
        if (peripherals.length > 0) {
          text += `🎧 *PERIFÉRICOS DESEADOS:* \n${peripherals.join(', ')}\n\n`;
        }
        
        text += `🤖 _Generado por Rich Power AI Assistant_`;

        return `https://wa.me/${STORE_PHONE}?text=${encodeURIComponent(text)}`;
      };

      const OptionCard = ({ iconClass, title, description, selected, onClick }) => (
        <div 
          onClick={onClick}
          className={`relative p-6 rounded-xl cursor-pointer transition-all duration-300 border-2 overflow-hidden group
            ${selected 
              ? 'bg-purple-900/40 border-purple-500 shadow-[0_0_20px_rgba(168,85,247,0.4)]' 
              : 'bg-slate-900/60 border-slate-700 hover:border-orange-500/50 hover:bg-slate-800'}`}
        >
          <div className="relative z-10 flex flex-col items-center text-center space-y-3">
            <div className={`p-4 rounded-full flex items-center justify-center w-16 h-16 ${selected ? 'bg-gradient-to-br from-purple-500 to-orange-500 text-white shadow-lg' : 'bg-slate-800 text-slate-400 group-hover:text-orange-400'} transition-colors`}>
              <i className={`${iconClass} text-2xl`}></i>
            </div>
            <h3 className={`font-bold text-lg ${selected ? 'text-white' : 'text-slate-200'}`}>{title}</h3>
            <p className="text-sm text-slate-400">{description}</p>
          </div>
          {selected && (
            <div className="absolute top-3 right-3 text-purple-400">
              <i className="fa-solid fa-circle-check text-2xl drop-shadow-[0_0_8px_rgba(168,85,247,0.8)]"></i>
            </div>
          )}
        </div>
      );

      return (
        <div className="min-h-screen relative flex flex-col">
          {/* Background Effects */}
          <div className="fixed inset-0 z-0 overflow-hidden pointer-events-none">
            <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-purple-600/20 blur-[120px] rounded-full mix-blend-screen"></div>
            <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-orange-600/20 blur-[120px] rounded-full mix-blend-screen"></div>
            <div className="absolute top-[40%] left-[60%] w-[30%] h-[30%] bg-red-600/10 blur-[100px] rounded-full mix-blend-screen"></div>
            <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-20 mix-blend-overlay"></div>
          </div>

          {/* Navbar */}
          <nav className="relative z-10 flex items-center justify-between px-6 py-4 border-b border-white/5 bg-slate-950/50 backdrop-blur-md sticky top-0">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 rounded-lg bg-gradient-to-br from-purple-600 via-red-500 to-orange-500 p-[2px] overflow-hidden shadow-[0_0_15px_rgba(168,85,247,0.4)]">
                <div className="w-full h-full bg-[#05050a] rounded-md flex items-center justify-center overflow-hidden">
                  <img src="./para-fondos.jpg" alt="Rich Power Logo" className="w-full h-full object-cover" onError={(e) => { e.target.style.display = 'none'; }} />
                </div>
              </div>
              <div>
                <h1 className="font-black text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">
                  RICH <span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-orange-500">POWER</span>
                </h1>
                <p className="text-[10px] text-purple-400 tracking-widest uppercase font-bold">Gaming Systems</p>
              </div>
            </div>
            {step > 0 && step < 8 && (
              <div className="hidden sm:flex items-center gap-2">
                <i className="fa-solid fa-shield-halved text-emerald-400"></i>
                <span className="text-xs text-slate-400">Asesoría Segura</span>
              </div>
            )}
          </nav>

          {/* Main Area */}
          <main className="relative z-10 max-w-4xl w-full mx-auto px-4 py-12 flex flex-col flex-grow">
            
            {/* Progress Bar */}
            {step > 0 && step < 8 && (
              <div className="w-full bg-slate-800/50 rounded-full h-1.5 mb-10 overflow-hidden backdrop-blur-sm border border-white/5">
                <div 
                  className="bg-gradient-to-r from-purple-500 via-red-500 to-orange-500 h-1.5 rounded-full transition-all duration-500 ease-out shadow-[0_0_10px_rgba(168,85,247,0.5)]"
                  style={{ width: `${(step / 7) * 100}%` }}
                ></div>
              </div>
            )}

            <div className="flex-grow flex flex-col justify-center">
              
              {/* STEP 0 */}
              {step === 0 && (
                <div className="text-center space-y-8 animate-[fadeIn_1s_ease-out]">
                  <div className="inline-block p-4 rounded-3xl bg-purple-500/10 border border-purple-500/20 backdrop-blur-sm mb-4">
                    <i className="fa-solid fa-rocket text-5xl text-orange-400 animate-pulse"></i>
                  </div>
                  <h2 className="text-5xl md:text-6xl font-black text-white leading-tight">
                    Construye tu <br/>
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-red-500 to-orange-500 filter drop-shadow-[0_0_10px_rgba(168,85,247,0.4)]">
                      Máquina Perfecta
                    </span>
                  </h2>
                  <p className="text-lg md:text-xl text-slate-400 max-w-2xl mx-auto">
                    Bienvenido al configurador inteligente de Rich Power. Responde unas preguntas rápidas y nuestra IA diseñará el setup ideal para tus necesidades y presupuesto.
                  </p>
                  <button onClick={nextStep} className="mt-8 relative inline-flex group items-center justify-center px-8 py-4 font-bold text-white transition-all duration-300 bg-gradient-to-r from-purple-600 to-orange-500 rounded-xl hover:scale-105 hover:shadow-[0_0_30px_rgba(168,85,247,0.5)] overflow-hidden">
                    <span className="relative flex items-center gap-2 text-lg">
                      Iniciar Configuración <i className="fa-solid fa-chevron-right ml-2"></i>
                    </span>
                  </button>
                </div>
              )}

              {/* STEP 1 */}
              {step === 1 && (
                <div className="space-y-8">
                  <div className="text-center">
                    <h2 className="text-3xl font-bold text-white mb-2">¿Qué estás buscando hoy?</h2>
                    <p className="text-slate-400">Selecciona el objetivo principal de tu visita.</p>
                  </div>
                  <div className="grid md:grid-cols-3 gap-4">
                    <OptionCard iconClass="fa-solid fa-desktop" title="PC Gamer Completa" description="Quiero una torre nueva lista para jugar." selected={formData.goal === 'new_pc'} onClick={() => handleSelect('goal', 'new_pc')} />
                    <OptionCard iconClass="fa-solid fa-rotate" title="Mejorar mi PC" description="Quiero actualizar componentes de mi equipo actual." selected={formData.goal === 'upgrade'} onClick={() => handleSelect('goal', 'upgrade')} />
                    <OptionCard iconClass="fa-solid fa-headphones" title="Periféricos" description="Solo busco monitores, teclados, tarjetas, etc." selected={formData.goal === 'components'} onClick={() => handleSelect('goal', 'components')} />
                  </div>
                </div>
              )}

              {/* STEP 2 */}
              {step === 2 && (
                <div className="space-y-8">
                  <div className="text-center">
                    <span className="text-purple-400 text-sm font-bold uppercase bg-purple-500/10 py-1 px-3 rounded-full">¡Excelente elección! 🔥</span>
                    <h2 className="text-3xl font-bold text-white mt-4 mb-2">¿Qué tipo de juegos o uso le darás?</h2>
                    <p className="text-slate-400">Puedes seleccionar varias opciones.</p>
                  </div>
                  <div className="grid md:grid-cols-2 gap-4">
                    <OptionCard iconClass="fa-solid fa-crosshairs" title="Esports Competitivo" description="Valorant, CS:GO, League of Legends, Fortnite." selected={formData.games.includes('esports')} onClick={() => handleSelect('games', 'esports', true)} />
                    <OptionCard iconClass="fa-solid fa-gamepad" title="Mundo Abierto / AAA" description="Cyberpunk, GTA V, Red Dead Redemption, Starfield." selected={formData.games.includes('aaa')} onClick={() => handleSelect('games', 'aaa', true)} />
                    <OptionCard iconClass="fa-solid fa-mobile-screen" title="Streaming / Creación" description="Twitch, YouTube, Edición de video, Renderizado." selected={formData.games.includes('streaming')} onClick={() => handleSelect('games', 'streaming', true)} />
                    <OptionCard iconClass="fa-solid fa-microchip" title="Simuladores / Trabajo" description="Flight Simulator, AutoCAD, Programación pesada." selected={formData.games.includes('work')} onClick={() => handleSelect('games', 'work', true)} />
                  </div>
                </div>
              )}

              {/* STEP 3 */}
              {step === 3 && (
                <div className="space-y-8">
                  <div className="text-center">
                    <h2 className="text-3xl font-bold text-white mb-2">¿Qué calidad gráfica buscas?</h2>
                    <p className="text-slate-400">Define cómo quieres que se vean tus juegos.</p>
                  </div>
                  <div className="grid md:grid-cols-3 gap-4">
                    <OptionCard iconClass="fa-solid fa-display" title="Estándar (1080p)" description="Fluido a 60-144fps. Ideal presupuestos ajustados." selected={formData.resolution === '1080p'} onClick={() => handleSelect('resolution', '1080p')} />
                    <OptionCard iconClass="fa-solid fa-desktop" title="Alta (1440p / 2K)" description="Gráficos detallados a 144fps+. El punto dulce." selected={formData.resolution === '1440p'} onClick={() => handleSelect('resolution', '1440p')} />
                    <OptionCard iconClass="fa-solid fa-bolt" title="Ultra (4K)" description="Máxima resolución. Para entusiastas en ultra." selected={formData.resolution === '4K'} onClick={() => handleSelect('resolution', '4K')} />
                  </div>
                </div>
              )}

              {/* STEP 4 */}
              {step === 4 && (
                <div className="space-y-8 max-w-2xl mx-auto w-full">
                  <div className="text-center">
                    <span className="text-orange-400 text-sm font-bold uppercase bg-orange-500/10 py-1 px-3 rounded-full">Hablemos de números 💰</span>
                    <h2 className="text-3xl font-bold text-white mt-4 mb-2">¿Cuál es tu presupuesto aproximado?</h2>
                  </div>
                  <div className="bg-slate-900/60 border border-slate-700 p-8 rounded-2xl mt-8">
                    <div className="flex justify-between items-end mb-6">
                      <span className="text-slate-400">Inversión estimada</span>
                      <span className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-orange-400">{formatCurrency(formData.budget)}</span>
                    </div>
                    <input type="range" min="1500000" max="15000000" step="500000" value={formData.budget} onChange={(e) => handleSelect('budget', parseInt(e.target.value))} className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-purple-500" />
                    <div className="flex justify-between text-xs text-slate-500 mt-3 font-bold">
                      <span>$1.5M COP</span>
                      <span>$15M+ COP</span>
                    </div>
                  </div>
                </div>
              )}

              {/* STEP 5 */}
              {step === 5 && (
                <div className="space-y-8">
                  <div className="text-center">
                    <h2 className="text-3xl font-bold text-white mb-2">Sobre tu PC Actual</h2>
                    <p className="text-slate-400">Para ayudarte a mejorar, necesitamos saber qué tienes.</p>
                  </div>
                  <div className="space-y-6">
                    <div className="grid md:grid-cols-2 gap-4">
                      <OptionCard iconClass="fa-solid fa-circle-check" title="Darla en parte de pago" description="Evaluaremos tu equipo para descontarlo." selected={formData.tradeIn === 'yes'} onClick={() => handleSelect('tradeIn', 'yes')} />
                      <OptionCard iconClass="fa-solid fa-rotate" title="Solo actualizarla" description="Mantendremos la base y cambiaremos piezas." selected={formData.tradeIn === 'no'} onClick={() => handleSelect('tradeIn', 'no')} />
                    </div>
                    <div className="bg-slate-900/60 border border-dashed border-slate-600 rounded-xl p-8 text-center hover:bg-slate-800/60 transition-colors cursor-pointer group">
                      <i className="fa-solid fa-upload text-4xl text-slate-400 group-hover:text-purple-400 mb-4 transition-colors"></i>
                      <h4 className="font-bold text-white mb-2">Sube una foto de tu PC actual</h4>
                      <p className="text-sm text-slate-400 mb-4">Ayuda a nuestros técnicos a ver el chasis y componentes.</p>
                      <label className="bg-slate-800 text-slate-300 py-2 px-4 rounded-lg cursor-pointer hover:bg-slate-700 font-bold text-sm">
                        Seleccionar Archivo <input type="file" className="hidden" accept="image/*" />
                      </label>
                    </div>
                  </div>
                </div>
              )}

              {/* STEP 6 */}
              {step === 6 && (
                <div className="space-y-8">
                  <div className="text-center">
                    <span className="text-purple-400 text-sm font-bold uppercase bg-purple-500/10 py-1 px-3 rounded-full">El Setup Perfecto 🎧</span>
                    <h2 className="text-3xl font-bold text-white mt-4 mb-2">¿Necesitas periféricos adicionales?</h2>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <OptionCard iconClass="fa-solid fa-display" title="Monitor" description="" selected={formData.peripherals.includes('monitor')} onClick={() => handleSelect('peripherals', 'monitor', true)} />
                    <OptionCard iconClass="fa-solid fa-keyboard" title="Teclado" description="" selected={formData.peripherals.includes('keyboard')} onClick={() => handleSelect('peripherals', 'keyboard', true)} />
                    <OptionCard iconClass="fa-solid fa-computer-mouse" title="Mouse" description="" selected={formData.peripherals.includes('mouse')} onClick={() => handleSelect('peripherals', 'mouse', true)} />
                    <OptionCard iconClass="fa-solid fa-headphones" title="Diadema" description="" selected={formData.peripherals.includes('audio')} onClick={() => handleSelect('peripherals', 'audio', true)} />
                  </div>
                </div>
              )}

              {/* STEP 7 */}
              {step === 7 && (
                <div className="space-y-8 max-w-xl mx-auto w-full">
                  <div className="text-center">
                    <h2 className="text-3xl font-bold text-white mb-2">Último paso</h2>
                    <p className="text-slate-400">Déjanos tus datos para generar tu cotización y enviarla a WhatsApp.</p>
                  </div>
                  <div className="bg-slate-900/80 border border-slate-700 p-6 rounded-2xl space-y-4">
                    <div>
                      <label className="block text-sm font-bold text-slate-400 mb-1">Nombre o Apodo Gamer</label>
                      <input type="text" placeholder="Ej. Juan Pérez / xX_Slayer_Xx" value={formData.name} onChange={(e) => handleSelect('name', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-purple-500 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-slate-400 mb-1">Teléfono / WhatsApp</label>
                      <input type="tel" placeholder="Ej. 300 123 4567" value={formData.phone} onChange={(e) => handleSelect('phone', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-purple-500 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-slate-400 mb-1">Ciudad</label>
                      <div className="relative">
                        <i className="fa-solid fa-location-dot absolute left-4 top-4 text-slate-500"></i>
                        <input type="text" value={formData.city} onChange={(e) => handleSelect('city', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg pl-10 pr-4 py-3 text-white focus:border-purple-500 focus:outline-none" />
                      </div>
                      <p className="text-xs text-slate-500 mt-1">Estamos en Cañaveral, pero enviamos a todo el país.</p>
                    </div>
                  </div>
                </div>
              )}

              {/* STEP 8 */}
              {step === 8 && (
                <div className="text-center py-20 flex flex-col items-center justify-center space-y-6">
                  <div className="relative">
                    <div className="w-24 h-24 rounded-full border-4 border-slate-800 border-t-purple-500 border-r-orange-500 animate-spin"></div>
                    <div className="absolute inset-0 flex items-center justify-center">
                      <i className="fa-solid fa-microchip text-purple-400 text-3xl animate-pulse"></i>
                    </div>
                  </div>
                  <h2 className="text-2xl font-bold text-white bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-orange-400">{loadingText}</h2>
                </div>
              )}

              {/* STEP 9 */}
              {step === 9 && (
                <div className="space-y-8 max-w-2xl mx-auto w-full">
                  <div className="text-center">
                    <div className="inline-block p-4 rounded-full bg-green-500/10 border border-green-500/20 mb-4">
                      <i className="fa-solid fa-circle-check text-5xl text-green-400"></i>
                    </div>
                    <h2 className="text-3xl font-black text-white mb-2">¡Perfecto, ya entendemos lo que necesitas! 🔥</h2>
                    <p className="text-slate-400">Hemos generado un perfil técnico para tu solicitud.</p>
                  </div>

                  <div className="bg-slate-900/60 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl relative">
                    <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-500 to-orange-500"></div>
                    <div className="p-6 md:p-8 space-y-6">
                      <div className="flex justify-between items-center border-b border-white/10 pb-4">
                        <div>
                          <p className="text-xs text-slate-500 uppercase font-bold tracking-wider">Cliente</p>
                          <p className="text-lg font-bold text-white">{formData.name || 'Gamer Anónimo'}</p>
                        </div>
                        <div className="text-right">
                          <p className="text-xs text-slate-500 uppercase font-bold tracking-wider">Presupuesto</p>
                          <p className="text-lg font-bold text-green-400">{formData.goal !== 'components' ? formatCurrency(formData.budget) : 'Variable'}</p>
                        </div>
                      </div>

                      <div className="space-y-3">
                        <h4 className="text-sm font-bold text-purple-400 uppercase tracking-wider flex items-center gap-2">
                          <i className="fa-solid fa-bolt text-sm"></i> Resumen Técnico
                        </h4>
                        <ul className="space-y-2 text-slate-300 text-sm">
                          <li><span className="text-orange-500 mr-2">•</span><strong>Objetivo:</strong> {formData.goal === 'new_pc' ? 'PC Armada Completa' : formData.goal === 'upgrade' ? 'Actualización de Hardware' : 'Periféricos/Componentes'}</li>
                          {formData.goal !== 'components' && (
                            <>
                              <li><span className="text-orange-500 mr-2">•</span><strong>Enfoque:</strong> {formData.games.length > 0 ? formData.games.map(g => g.toUpperCase()).join(', ') : 'Uso general'}</li>
                              <li><span className="text-orange-500 mr-2">•</span><strong>Rendimiento:</strong> {formData.resolution || 'No especificado'}</li>
                            </>
                          )}
                        </ul>
                      </div>
                    </div>
                  </div>

                  <a href={generateWhatsAppLink()} target="_blank" className="w-full flex items-center justify-center gap-3 bg-[#25D366] hover:bg-[#20bd5a] text-white font-bold text-lg py-5 px-8 rounded-xl transition-all hover:scale-[1.02]">
                    <i className="fa-brands fa-whatsapp text-2xl"></i> Enviar Cotización a WhatsApp
                  </a>
                </div>
              )}

            </div>

            {/* Navigation Buttons */}
            {step > 0 && step < 8 && (
              <div className="mt-12 flex justify-between items-center border-t border-white/10 pt-6">
                <button onClick={prevStep} className="px-6 py-2.5 rounded-lg font-bold text-slate-400 hover:text-white hover:bg-slate-800">Volver</button>
                <button 
                  onClick={nextStep}
                  disabled={(step === 1 && !formData.goal) || (step === 7 && (!formData.name || !formData.phone))}
                  className={`flex items-center gap-2 px-8 py-2.5 rounded-lg font-bold transition-all ${
                    (step === 1 && !formData.goal) || (step === 7 && (!formData.name || !formData.phone))
                      ? 'bg-slate-800 text-slate-500 cursor-not-allowed'
                      : 'bg-purple-600 text-white hover:bg-purple-500'
                  }`}
                >
                  {step === 7 ? 'Analizar' : 'Siguiente'} <i className="fa-solid fa-chevron-right ml-1"></i>
                </button>
              </div>
            )}

            {/* Footer info */}
            <div className="mt-12 text-center text-xs text-slate-600 border-t border-white/5 pt-6 pb-2">
              <p className="font-bold text-slate-500 mb-1">Rich Power - Gaming Systems</p>
              <p>CRA 28 #22 - 10 Molinos Altos Cañaveral (Frente al Conjunto Andalucía)</p>
              <p>Floridablanca, Santander, Colombia</p>
            </div>
          </main>
        </div>
      );
    }

    // Inicializar React
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <style>
    /* Pequeña animación de entrada suave */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</body>
</html>
